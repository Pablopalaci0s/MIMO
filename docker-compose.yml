services:
  postgres:
    image: postgres:16-alpine
    container_name: mimo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mimo
    ports:
      - "5432:5432"
    volumes:
      - mimo_postgres_data:/var/lib/postgresql/data

volumes:
  mimo_postgres_data:
