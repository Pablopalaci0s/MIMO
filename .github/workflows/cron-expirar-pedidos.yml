name: Cron — expirar pedidos de PayPal sin confirmar

# Job programado real (ver README "Diseño: pagos con PayPal" y
# apps/web/src/app/api/cron/expirar-pedidos/route.ts). Cancela y reembolsa
# la parte de un pedido pagado con PayPal que un negocio no confirmó dentro
# de la ventana (45 min). No hace nada hasta que el sitio esté desplegado y
# tenga estos dos secrets configurados en Settings → Secrets and variables
# → Actions:
#   APP_URL      → https://tu-dominio-real (sin barra final)
#   CRON_SECRET  → el mismo valor que CRON_SECRET en el .env del servidor
# "workflow_dispatch" permite correrlo a mano desde la pestaña Actions.
on:
  schedule:
    - cron: "*/15 * * * *" # cada 15 minutos
  workflow_dispatch: {}

jobs:
  expirar-pedidos:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de expiración
        run: |
          if [ -z "${{ secrets.APP_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "Faltan los secrets APP_URL y/o CRON_SECRET — configuralos en Settings → Secrets and variables → Actions."
            exit 1
          fi
          curl -sf --fail-with-body \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/expirar-pedidos"
